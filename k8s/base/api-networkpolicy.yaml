apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: model-pricing
          # Expressions prevent Kustomize commonLabels from imposing this
          # application's labels on callers in other namespaces.
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [web]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [prometheus]
        # model-speed's API and unlabeled benchmark Jobs read this catalog.
        # This deliberately trusts that namespace, not an app-specific label.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: model-speed
          podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
