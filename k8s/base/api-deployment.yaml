apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrate
          image: gitlab.andrea-house.com:5050/root/model-pricing/api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: model-pricing-config }
            - secretRef:    { name: model-pricing-secrets }
            - secretRef:    { name: ses-creds }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: api
          image: gitlab.andrea-house.com:5050/root/model-pricing/api:latest
          imagePullPolicy: Always
          ports:
            - { containerPort: 8000, name: http }
          envFrom:
            - configMapRef: { name: model-pricing-config }
            - secretRef:    { name: model-pricing-secrets }
            - secretRef:    { name: ses-creds }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: 1,    memory: 512Mi }
          # timeoutSeconds is explicit because the kubelet default is 1s and
          # /readyz makes two network round trips (Postgres SELECT 1 and a
          # Redis PING). That does not reliably finish inside a second:
          # on 2026-09-20 it failed three times in 49 minutes with "context
          # deadline exceeded". The handler now bounds itself at
          # _READYZ_BUDGET_S (2s, api/app/routes/health.py), so this deadline
          # only needs to sit above that bound. /healthz does no I/O at all,
          # but a 1s default can still be missed under load, and a missed
          # LIVENESS probe restarts the pod -- so it gets headroom too.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  # Intentional no-op: single-replica Deployment. A PDB with minAvailable>=1
  # would block all voluntary disruptions; setting it to 0 means the PDB
  # exists (so the resource is tracked) but imposes no constraint. Bumping
  # replicas to 2+ AND changing this to maxUnavailable: 0 is the right next
  # step once we move off the single-replica constraint (see INF-020).
  minAvailable: 0
  selector:
    matchLabels: { app: api }
