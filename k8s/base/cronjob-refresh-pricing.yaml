apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh-pricing
spec:
  schedule: "*/5 * * * *"       # every 5 min
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      # 2 -> 4 (2026-07-28): failed 5 times today (00:20, 00:25, 00:45, 04:30,
      # 04:35 MDT), all inside the home cluster's two nightly node-rotation
      # windows — a dependency pod (DB/API backend) was mid-reschedule and the
      # 2-retry budget (10s+20s ~= 30s of backoff) didn't outlast the gap.
      # Every run since has succeeded; the 5-min schedule already makes a
      # single missed tick harmless, so this is about wasting fewer runs to
      # a known-transient window, not an outage. 4 retries stays well inside
      # activeDeadlineSeconds (cumulative backoff 10+20+40+80=150s of 300s).
      backoffLimit: 4
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: refresh
              image: gitlab.andrea-house.com:5050/root/model-pricing/api:latest
              command: ["python", "-m", "app.jobs.refresh_pricing"]
              envFrom:
                - configMapRef: { name: model-pricing-config }
                - secretRef:    { name: model-pricing-secrets }
              resources:
                requests: { cpu: 50m,  memory: 128Mi }
                limits:   { cpu: 500m, memory: 384Mi }
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
