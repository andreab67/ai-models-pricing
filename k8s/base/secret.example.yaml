# Do NOT commit real values. Replace with SealedSecret / ExternalSecret in production.
# SMTP credentials live in the separate ses-creds secret (same as ntp-checker).
apiVersion: v1
kind: Secret
metadata:
  name: sr-models-secrets
type: Opaque
stringData:
