# DO NOT `kubectl apply` THIS FILE. It is a TEMPLATE for the production
# Secret, which must be provisioned as a SealedSecret / ExternalSecret so
# that no plaintext credentials ever sit in the cluster gitops pipeline.
# The Secret must be named "model-pricing-secrets" in the "model-pricing"
# namespace, matching what the api Deployment + every CronJob references
# via explicit env.valueFrom.secretKeyRef entries (no workload uses envFrom on
# it, so each pod receives only the keys it lists). SMTP credentials live in the
# separate ses-creds secret.
#
# Key -> consumer map (keep in sync with the manifests; a pytest pins the
# GITLAB_TOKEN rule):
#   DATABASE_URL         api, migrate (init), refresh-pricing, kilo-diff
#   REDIS_URL            api, refresh-pricing, daily-report, kilo-diff
#   OPENROUTER_API_KEY   api, refresh-pricing, daily-report, kilo-diff
#   OPENROUTER_ADMIN_KEY, KILO_API_KEY, MINIMAX_API_KEY, DEEPSEEK_API_KEY
#                        api only (dashboard account cards)
#   KILO_TIER            api, daily-report
#   GITLAB_TOKEN         kilo-diff ONLY
apiVersion: v1
kind: Secret
metadata:
  name: model-pricing-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://model_pricing:CHANGE_ME@pgvector-cluster.pgvector.svc.cluster.local:5432/aimodels
  REDIS_URL: redis://:CHANGE_ME_REDIS_PASSWORD@redis.redis.svc.cluster.local:6379/0
  OPENROUTER_API_KEY: sk-or-placeholder-key
  KILO_API_KEY: kl-placeholder-key
  KILO_TIER: starter
  # Used only by the kilo-diff CronJob (the only workload that references this
  # key): it pushes a bot branch with the kilo_plans.yaml update and opens a
  # merge request. The Commits and Merge Requests APIs both need the `api`
  # scope, so write_repository alone is not enough. The narrowest token that
  # works is a Project Access Token for root/model-pricing with the `api` scope
  # and the Developer role.
  GITLAB_TOKEN: glpat-placeholder-token
