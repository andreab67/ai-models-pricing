  REDIS_URL: redis://:CHANGE_ME_REDIS_PASSWORD@redis.redis.svc.cluster.local:6379/0
  OPENROUTER_API_KEY: sk-or-placeholder-key
  KILO_API_KEY: kl-placeholder-key
  KILO_TIER: starter
