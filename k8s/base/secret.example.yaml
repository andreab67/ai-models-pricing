# DO NOT `kubectl apply` THIS FILE. It is a TEMPLATE for the production
# Secret, which must be provisioned as a SealedSecret / ExternalSecret so
# that no plaintext credentials ever sit in the cluster gitops pipeline.
# The Secret must be named "model-pricing-secrets" in the "model-pricing"
# namespace, matching what the api Deployment + every CronJob references
# via secretRef. SMTP credentials live in the separate ses-creds secret.
apiVersion: v1
kind: Secret
metadata:
  name: model-pricing-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://model_pricing:CHANGE_ME@pgvector-cluster.pgvector.svc.cluster.local:5432/aimodels
  REDIS_URL: redis://:CHANGE_ME_REDIS_PASSWORD@redis.redis.svc.cluster.local:6379/0
  OPENROUTER_API_KEY: sk-or-placeholder-key
  KILO_API_KEY: kl-placeholder-key
  KILO_TIER: starter
  # Used only by the kilo-diff CronJob to auto-commit kilo_plans.yaml updates.
  # Project Access Token scoped to root/model-pricing (api + write_repository).
  GITLAB_TOKEN: glpat-placeholder-token
