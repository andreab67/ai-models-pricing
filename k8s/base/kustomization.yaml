apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: model-pricing
# `labels` replaces the deprecated `commonLabels`. includeSelectors keeps the
# existing Deployment selectors unchanged (selectors are immutable).
labels:
  - pairs:
      app.kubernetes.io/part-of: model-pricing
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
resources:
  - namespace.yaml
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress.yaml
  - cronjob-refresh-pricing.yaml
  - cronjob-daily-report.yaml
  - cronjob-kilo-diff.yaml
  - servicemonitor.yaml
