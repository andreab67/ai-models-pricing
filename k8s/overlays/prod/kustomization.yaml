apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: model-pricing
resources:
  - ../../base
# Pin images to the commit CI built instead of a moving tag, e.g.:
#   kustomize edit set image \
#     ghcr.io/andreab67/ai-models-pricing/api=ghcr.io/andreab67/ai-models-pricing/api:$SHA \
#     ghcr.io/andreab67/ai-models-pricing/web=ghcr.io/andreab67/ai-models-pricing/web:$SHA
images:
  - name: ghcr.io/andreab67/ai-models-pricing/api
    newTag: latest
  - name: ghcr.io/andreab67/ai-models-pricing/web
    newTag: latest
patches:
  # Public hostname for the prod ingress (the base uses a placeholder).
  - target:
      kind: Ingress
      name: models
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: models.andrea-house.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: models.andrea-house.com
