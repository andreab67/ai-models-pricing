# Local dev stack: postgres + redis + api + web.
# Run: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_DB: pricing
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d pricing"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: ./api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://pricing:pricing@postgres:5432/pricing
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./api
    ports: ["8000:8000"]
    # Provider API keys, SMTP, etc. (copy api/.env.example to api/.env).
    # Values under `environment` below take precedence.
    # The long env_file form with `required:` needs Docker Compose v2.24+.
    env_file:
      - path: ./api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://pricing:pricing@postgres:5432/pricing
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }

  web:
    build: ./web
    ports: ["3000:3000"]
    environment:
      # Read at request time by the web proxy route.
      API_BASE_URL: http://api:8000
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata: {}
