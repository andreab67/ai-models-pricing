stages:
  - lint
  - sast
  - build
  - test
  - deploy

variables:
  IMAGE_API: ${CI_REGISTRY}/${CI_PROJECT_PATH}/api
  IMAGE_WEB: ${CI_REGISTRY}/${CI_PROJECT_PATH}/web

lint:web:
  stage: lint
  tags: [k8s]
  image: node:22-alpine
  script:
    - cd web
    - npm install --frozen-lockfile
    - npm run lint
    - npm run typecheck
  cache:
    paths:
      - web/node_modules/
  only:
    - merge_requests
    - main

lint:api:
  stage: lint
  tags: [k8s]
  image: python:3.14-slim
  script:
    - cd api
    - pip install --no-cache-dir ruff
    - ruff check app tests
  only:
    - merge_requests
    - main

test:api:
  stage: test
  tags: [k8s]
  image: python:3.14-slim
  script:
    - cd api
    - pip install --no-cache-dir -e ".[dev]"
    - pytest tests -q
  only:
    - merge_requests
    - main

scan:api-base-trivy:
  stage: sast
  tags: [k8s]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    # Job name explicitly says "base" — it scans the upstream base image
    # (python:3.14-slim), NOT the kaniko-built api image. The built image
    # is scanned by `scan:api-image-trivy` once `build:api` completes.
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format json --output api-scan.json python:3.14-slim
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format sarif --output api-scan.sarif python:3.14-slim
    - echo "API base image scanned"
  artifacts:
    reports:
      sast: api-scan.sarif
    paths:
      - api-scan.json
      - api-scan.sarif
  allow_failure: true
  only:
    - merge_requests
    - main

scan:web-base-trivy:
  stage: sast
  tags: [k8s]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    # Job name explicitly says "base" — scans upstream node:22-alpine, NOT
    # the kaniko-built web image. The built image is scanned by
    # `scan:web-image-trivy` once `build:web` completes.
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format json --output web-scan.json node:22-alpine
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format sarif --output web-scan.sarif node:22-alpine
    - echo "Web base image scanned"
  artifacts:
    reports:
      sast: web-scan.sarif
    paths:
      - web-scan.json
      - web-scan.sarif
  allow_failure: true
  only:
    - merge_requests
    - main

build:api:
  stage: build
  tags: [k8s]
  timeout: 1h
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - |
      mkdir -p /kaniko/.docker
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' \
        "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        > /kaniko/.docker/config.json
  script:
    - |
      TAG="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
      # Only default-branch pipelines move the shared :latest tag. MR pipelines
      # still build and push :<sha> (so the build is validated), but must not
      # overwrite :latest with unmerged code: k8s/ manifests still reference it.
      # CI_COMMIT_BRANCH is unset in MR pipelines, so the test is false there.
      set -- --destination "${IMAGE_API}:${TAG}"
      if [ -n "${CI_COMMIT_BRANCH:-}" ] && [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        set -- "$@" --destination "${IMAGE_API}:latest"
      fi
      echo "Building ${IMAGE_API}:${TAG} ($*)"
      /kaniko/executor \
        --context "dir://${CI_PROJECT_DIR}/api" \
        --dockerfile "${CI_PROJECT_DIR}/api/Dockerfile" \
        "$@" \
        --skip-tls-verify \
        --snapshot-mode=redo \
        --push-retry=3
  only:
    - merge_requests
    - main

build:web:
  stage: build
  tags: [k8s]
  timeout: 1h
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - |
      mkdir -p /kaniko/.docker
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' \
        "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        > /kaniko/.docker/config.json
  script:
    - |
      TAG="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
      # :latest only from the default branch -- see build:api.
      set -- --destination "${IMAGE_WEB}:${TAG}"
      if [ -n "${CI_COMMIT_BRANCH:-}" ] && [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        set -- "$@" --destination "${IMAGE_WEB}:latest"
      fi
      echo "Building ${IMAGE_WEB}:${TAG} ($*)"
      /kaniko/executor \
        --context "dir://${CI_PROJECT_DIR}/web" \
        --dockerfile "${CI_PROJECT_DIR}/web/Dockerfile" \
        "$@" \
        --skip-tls-verify \
        --snapshot-mode=redo \
        --push-retry=3
  only:
    - merge_requests
    - main

test:db-migrations:
  stage: test
  tags: [k8s]
  image: python:3.14-slim
  script:
    - cd api
    - pip install --no-cache-dir -e ".[dev]"
    - python -c "import starlette; print(f'Starlette {starlette.__version__} installed')"
    - alembic upgrade head --sql
    - echo "Database schema migrations validated"
  only:
    - merge_requests
    - main

# Deploy to home Kubernetes cluster (main only).
# The api Deployment carries a `migrate` initContainer that runs
# `alembic upgrade head` before the app container starts. We MUST bump that
# initContainer image alongside the `api` container — otherwise it runs a stale
# image and DB migrations silently never reach prod (root cause of v1.5.0's
# missing speed columns). `kubectl set image` matches both containers and
# initContainers by name. The init step is idempotent (no-op when already at
# head) and ordered before the app, so the rollout's readiness gate guarantees
# the schema is current before traffic shifts.
#
# Automatic: every green pipeline on `main` deploys to production. The
# `environment: production` block makes the production context visible
# alongside the job.
#
# `needs` must list every `test` stage job as well as the two builds. `needs`
# overrides stage ordering, so listing only the builds would let the deploy
# start the moment they finish — racing, and usually beating, the checks in
# the earlier `test` stage. That is harmless behind a manual gate (an operator
# reads the pipeline before clicking) but not on an automatic one, where it
# would ship a schema change, or a failing test suite, that nothing validated.
# Add any new `test` stage job here too.
deploy:k8s:
  stage: deploy
  tags: [k8s]
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  needs: [build:api, build:web, test:db-migrations, test:api]
  environment:
    name: production
    url: https://models.andrea-house.com
  script:
    - echo "${KUBE_CONFIG}" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - kubectl set image deployment/api migrate=${IMAGE_API}:${CI_COMMIT_SHORT_SHA} api=${IMAGE_API}:${CI_COMMIT_SHORT_SHA} -n model-pricing
    - kubectl set image deployment/web web=${IMAGE_WEB}:${CI_COMMIT_SHORT_SHA} -n model-pricing
    - kubectl set image cronjob/refresh-pricing refresh=${IMAGE_API}:${CI_COMMIT_SHORT_SHA} -n model-pricing
    - kubectl set image cronjob/daily-report report=${IMAGE_API}:${CI_COMMIT_SHORT_SHA} -n model-pricing
    - kubectl set image cronjob/kilo-diff diff=${IMAGE_API}:${CI_COMMIT_SHORT_SHA} -n model-pricing
    - set +e
    - kubectl rollout status deployment/api -n model-pricing --timeout=120s
    - api_rc=$?
    - kubectl rollout status deployment/web -n model-pricing --timeout=120s
    - web_rc=$?
    - set -e
    - if [ "$api_rc" -ne 0 ] || [ "$web_rc" -ne 0 ]; then
    -     echo "Rollout failed; reverting to previous revision"
    -     kubectl rollout undo deployment/api -n model-pricing || true
    -     kubectl rollout undo deployment/web -n model-pricing || true
    -     exit 1
    - fi
  only:
    - main
