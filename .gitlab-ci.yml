stages:
  - lint
  - sast
  - build
  - test
  - deploy

variables:
  IMAGE_API: ${CI_REGISTRY}/${CI_PROJECT_PATH}/api
  IMAGE_WEB: ${CI_REGISTRY}/${CI_PROJECT_PATH}/web

lint:web:
  stage: lint
  image: node:22-alpine
  script:
    - cd web
    - npm install --frozen-lockfile
    - npm run lint
    - npm run typecheck
  cache:
    paths:
      - web/node_modules/
  only:
    - merge_requests
    - main

scan:api-trivy:
  stage: sast
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format json --output api-scan.json python:3.14-slim
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format sarif --output api-scan.sarif python:3.14-slim
    - echo "API base image scanned"
  artifacts:
    reports:
      sast: api-scan.sarif
    paths:
      - api-scan.json
      - api-scan.sarif
  allow_failure: true
  only:
    - merge_requests
    - main

scan:web-trivy:
  stage: sast
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format json --output web-scan.json node:22-alpine
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format sarif --output web-scan.sarif node:22-alpine
    - echo "Web base image scanned"
  artifacts:
    reports:
      sast: web-scan.sarif
    paths:
      - web-scan.json
      - web-scan.sarif
  allow_failure: true
  only:
    - merge_requests
    - main

build:api:
  stage: build
  timeout: 1h
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - |
      mkdir -p /kaniko/.docker
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' \
        "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        > /kaniko/.docker/config.json
  script:
    - |
      TAG="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
      echo "Building ${IMAGE_API}:${TAG}"
      /kaniko/executor \
        --context "dir://${CI_PROJECT_DIR}/api" \
        --dockerfile "${CI_PROJECT_DIR}/api/Dockerfile" \
        --destination "${IMAGE_API}:${TAG}" \
        --destination "${IMAGE_API}:latest" \
        --skip-tls-verify \
        --snapshot-mode=redo \
        --push-retry=3
  only:
    - merge_requests
    - main

build:web:
  stage: build
  timeout: 1h
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - |
      mkdir -p /kaniko/.docker
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' \
        "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        > /kaniko/.docker/config.json
  script:
    - |
      TAG="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
      echo "Building ${IMAGE_WEB}:${TAG}"
      /kaniko/executor \
        --context "dir://${CI_PROJECT_DIR}/web" \
        --dockerfile "${CI_PROJECT_DIR}/web/Dockerfile" \
        --destination "${IMAGE_WEB}:${TAG}" \
        --destination "${IMAGE_WEB}:latest" \
        --skip-tls-verify \
        --snapshot-mode=redo \
        --push-retry=3
  only:
    - merge_requests
    - main

test:db-migrations:
  stage: test
  image: python:3.14-slim
  script:
    - cd api
    - pip install --no-cache-dir -e ".[dev]"
    - python -c "import starlette; print(f'Starlette {starlette.__version__} installed')"
    - alembic upgrade head --sql
    - echo "Database schema migrations validated"
  only:
    - merge_requests
    - main

# Apply Alembic migrations to prod via the freshly built API image, BEFORE the
# rollout (main only). Idempotent: `alembic upgrade head` is a no-op when already
# at head, and the Job is recreated per commit SHA so pipeline retries are safe.
migrate:db:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  needs: [build:api]
  variables:
    JOB: "alembic-migrate-${CI_COMMIT_SHORT_SHA}"
  script:
    - echo "${KUBE_CONFIG}" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - kubectl delete job "${JOB}" -n model-pricing --ignore-not-found
    - |
      cat <<EOF | kubectl apply -f -
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: ${JOB}
        namespace: model-pricing
      spec:
        backoffLimit: 0
        ttlSecondsAfterFinished: 600
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: migrate
                image: ${IMAGE_API}:${CI_COMMIT_SHORT_SHA}
                command: ["alembic", "upgrade", "head"]
                envFrom:
                  - secretRef:
                      name: model-pricing-secrets
      EOF
    - |
      echo "Waiting for migration job ${JOB}..."
      for i in $(seq 1 60); do
        succeeded=$(kubectl get job/${JOB} -n model-pricing -o jsonpath='{.status.succeeded}' 2>/dev/null || true)
        failed=$(kubectl get job/${JOB} -n model-pricing -o jsonpath='{.status.failed}' 2>/dev/null || true)
        if [ "${succeeded}" = "1" ]; then
          echo "Migration complete."; kubectl logs "job/${JOB}" -n model-pricing || true; exit 0
        fi
        if [ -n "${failed}" ] && [ "${failed}" != "0" ]; then
          echo "Migration FAILED."; kubectl logs "job/${JOB}" -n model-pricing || true; exit 1
        fi
        sleep 3
      done
      echo "Migration job timed out."; kubectl logs "job/${JOB}" -n model-pricing || true; exit 1
  only:
    - main

# Deploy to home Kubernetes cluster (main only)
deploy:k8s:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  needs: [build:api, build:web, migrate:db]
  script:
    - echo "${KUBE_CONFIG}" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - kubectl set image deployment/api api=${IMAGE_API}:${CI_COMMIT_SHORT_SHA} -n model-pricing
    - kubectl set image deployment/web web=${IMAGE_WEB}:${CI_COMMIT_SHORT_SHA} -n model-pricing
    - kubectl rollout status deployment/api -n model-pricing --timeout=120s
    - kubectl rollout status deployment/web -n model-pricing --timeout=120s
  only:
    - main
