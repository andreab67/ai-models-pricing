include:
  - project: greenyogainc/ci-templates
    ref: 55653bdf9cbe0a67479d134b83f4d61624af0554
    file: /container-build.yml

stages:
  - lint
  - sast
  - build
  - test
  - deploy

variables:
  IMAGE_API: ${CI_REGISTRY}/${CI_PROJECT_PATH}/api
  IMAGE_WEB: ${CI_REGISTRY}/${CI_PROJECT_PATH}/web

lint:web:
  stage: lint
  tags: [k8s]
  image: node:22-alpine@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202
  script:
    - cd web
    # `npm ci` fails if package-lock.json is out of sync with package.json
    # (`--frozen-lockfile` is a yarn flag that npm silently ignores). It wipes
    # node_modules/ first, so cache npm's download cache instead.
    - npm ci --no-audit --no-fund --prefer-offline --cache .npm
    - npm run lint
    - npm run typecheck
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/.npm/
  only:
    - merge_requests
    - main

lint:api:
  stage: lint
  tags: [k8s]
  image: python:3.14-slim@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
  script:
    - cd api
    - pip install --no-cache-dir --require-hashes -r requirements-dev.lock
    - ruff check app tests
  only:
    - merge_requests
    - main

test:api:
  stage: test
  tags: [k8s]
  image: python:3.14-slim@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates jq
    - sh ci/install-kustomize.sh
    - sh ci/install-kubectl.sh
    - cd api
    - pip install --no-cache-dir --require-hashes -r requirements-dev.lock
    - sh ../ci/check-locks.sh
    - pytest tests -q --cov=app --cov-report=term-missing --cov-fail-under=60
  only:
    - merge_requests
    - main

scan:api-base-trivy:
  stage: sast
  tags: [k8s]
  image:
    name: aquasec/trivy:latest@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    entrypoint: [""]
  script:
    # Job name explicitly says "base" — it scans the upstream base image
    # (python:3.14-slim@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f), NOT the shared BuildKit-built api image. The built image
    # is scanned by `scan:api-image-trivy` once `build:api` completes.
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format json --output api-scan.json python:3.14-slim@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format sarif --output api-scan.sarif python:3.14-slim@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
    - echo "API base image scanned"
  artifacts:
    reports:
      sast: api-scan.sarif
    paths:
      - api-scan.json
      - api-scan.sarif
  allow_failure: true
  only:
    - merge_requests
    - main

scan:web-base-trivy:
  stage: sast
  tags: [k8s]
  image:
    name: aquasec/trivy:latest@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    entrypoint: [""]
  script:
    # Job name explicitly says "base" — scans upstream node:22-alpine@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202, NOT
    # the shared BuildKit-built web image. The built image is scanned by
    # `scan:web-image-trivy` once `build:web` completes.
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format json --output web-scan.json node:22-alpine@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format sarif --output web-scan.sarif node:22-alpine@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202
    - echo "Web base image scanned"
  artifacts:
    reports:
      sast: web-scan.sarif
    paths:
      - web-scan.json
      - web-scan.sarif
  allow_failure: true
  only:
    - merge_requests
    - main

build:api:
  extends: .container-build
  stage: build
  timeout: 1h
  variables:
    CONTAINER_BUILD_CONTEXT: "$CI_PROJECT_DIR/api"
    CONTAINER_IMAGE_REPO: "$CI_REGISTRY_IMAGE/api"
  only:
    - merge_requests
    - main

dockerfile-lint:api:
  extends: .container-hadolint
  variables:
    CONTAINER_BUILD_CONTEXT: "$CI_PROJECT_DIR/api"
  only:
    - merge_requests
    - main

build:web:
  extends: .container-build
  stage: build
  timeout: 1h
  variables:
    CONTAINER_BUILD_CONTEXT: "$CI_PROJECT_DIR/web"
    CONTAINER_IMAGE_REPO: "$CI_REGISTRY_IMAGE/web"
  only:
    - merge_requests
    - main

dockerfile-lint:web:
  extends: .container-hadolint
  variables:
    CONTAINER_BUILD_CONTEXT: "$CI_PROJECT_DIR/web"
  only:
    - merge_requests
    - main

# Blocking scans of the images that deploy:k8s ships (the SHA-tagged build
# output, not the upstream base images the sast jobs above look at). They sit
# in the `test` stage (needs: the build) so they run in parallel with test:*;
# a separate stage would make every test job wait for the scans, and an MR
# author would get no test results while a scan is red.
# - HIGH/CRITICAL fail the job (exit 1). --ignore-unfixed skips findings that
#   have no upstream fix yet: nothing can be done about those and failing the
#   deploy on them would just freeze it.
# - --image-src remote pulls from the registry with job-scoped credentials.
#   The reviewed internal CA augments public roots and TLS verification stays on.
scan:api-image-trivy:
  stage: test
  tags: [k8s]
  image:
    name: aquasec/trivy:latest@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    entrypoint: [""]
  needs: [build:api]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_NO_PROGRESS: "true"
  before_script:
    - apk add --no-cache jq
    - . ci/trust-registry.sh
    - IMAGE_DIGEST=$(sh ci/read-image-digest.sh build-api "$IMAGE_API" "$CI_COMMIT_SHA")
    - export IMAGE_DIGEST
  script:
    - trivy image --image-src remote --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE_API}@${IMAGE_DIGEST}"
  only:
    - merge_requests
    - main

scan:web-image-trivy:
  stage: test
  tags: [k8s]
  image:
    name: aquasec/trivy:latest@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    entrypoint: [""]
  needs: [build:web]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_NO_PROGRESS: "true"
  before_script:
    - apk add --no-cache jq
    - . ci/trust-registry.sh
    - IMAGE_DIGEST=$(sh ci/read-image-digest.sh build-web "$IMAGE_WEB" "$CI_COMMIT_SHA")
    - export IMAGE_DIGEST
  script:
    - trivy image --image-src remote --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE_WEB}@${IMAGE_DIGEST}"
  only:
    - merge_requests
    - main

test:db-migrations:
  stage: test
  tags: [k8s]
  image: python:3.14-slim@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
  script:
    - cd api
    - pip install --no-cache-dir --require-hashes -r requirements-dev.lock
    - python -c "import starlette; print(f'Starlette {starlette.__version__} installed')"
    - alembic upgrade head --sql
    - echo "Database schema migrations validated"
  only:
    - merge_requests
    - main

# Deploy to home Kubernetes cluster (main only).
# The api Deployment carries a `migrate` initContainer that runs
# `alembic upgrade head` before the app container starts. We MUST bump that
# initContainer image alongside the `api` container — otherwise it runs a stale
# image and DB migrations silently never reach prod (root cause of v1.5.0's
# missing speed columns). `kubectl set image` matches both containers and
# initContainers by name. The init step is idempotent (no-op when already at
# head) and ordered before the app, so the rollout's readiness gate guarantees
# the schema is current before traffic shifts.
#
# Automatic: every green pipeline on `main` deploys to production. The
# `environment: production` block makes the production context visible
# alongside the job.
#
# `needs` must list every lint, scan and `test` stage job as well as the two
# builds. `needs` overrides stage ordering, so listing only the builds would
# let the deploy start the moment they finish - racing, and usually beating,
# the checks in the other stages. That is harmless behind a manual gate (an
# operator reads the pipeline before clicking) but not on an automatic one,
# where it would ship a schema change, a failing test suite, a lint failure or
# an image with a HIGH/CRITICAL finding that nothing validated. None of these
# jobs may carry allow_failure. Add any new lint/scan/test job here too.
deploy:k8s:
  stage: deploy
  tags: [k8s]
  image: debian:stable-slim@sha256:fbfb4059d2127120aa05b6e6064523d2102552f0cf0026ddf0701c12f1f8f3e0
  resource_group: model-pricing-production
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates jq
    - sh ci/install-kubectl.sh
    - sh ci/install-kustomize.sh
  needs:
    - build:api
    - build:web
    - dockerfile-lint:api
    - dockerfile-lint:web
    - lint:web
    - lint:api
    - scan:api-image-trivy
    - scan:web-image-trivy
    - test:db-migrations
    - test:api
  environment:
    name: production
    url: https://models.andrea-house.com
  script:
    - echo "${KUBE_CONFIG}" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - bash scripts/deploy-prod.sh
  artifacts:
    paths: [rendered-prod.yaml]
  only:
    - main
