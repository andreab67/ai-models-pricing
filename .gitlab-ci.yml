stages:
  - lint
  - sast
  - build
  - test

variables:
  HARBOR_REGISTRY: "harbor.cloudreviewer.net"
  HARBOR_PROJECT: "sr"
  IMAGE_API: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/sr-models-api"
  IMAGE_WEB: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/sr-models-web"

lint:web:
  stage: lint
  image: node:22-alpine
  script:
    - cd web
    - npm install --frozen-lockfile
    - npm run lint
    - npm run typecheck
  cache:
    paths:
      - web/node_modules/
  only:
    - merge_requests
    - main

scan:api-trivy:
  stage: sast
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format json --output api-scan.json python:3.14-slim
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format sarif --output api-scan.sarif python:3.14-slim
    - echo "API base image scanned"
  artifacts:
    reports:
      sast: api-scan.sarif
    paths:
      - api-scan.json
      - api-scan.sarif
  allow_failure: true
  only:
    - merge_requests
    - main

scan:web-trivy:
  stage: sast
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format json --output web-scan.json node:22-alpine
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format sarif --output web-scan.sarif node:22-alpine
    - echo "Web base image scanned"
  artifacts:
    reports:
      sast: web-scan.sarif
    paths:
      - web-scan.json
      - web-scan.sarif
  allow_failure: true
  only:
    - merge_requests
    - main

build:api:
  stage: build
  timeout: 1h
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - |
      mkdir -p /kaniko/.docker
      AUTH="$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$HARBOR_REGISTRY" "$AUTH" \
        > /kaniko/.docker/config.json
  script:
    - |
      TAG="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
      echo "Building ${IMAGE_API}:${TAG}"
      /kaniko/executor \
        --context "dir://${CI_PROJECT_DIR}/api" \
        --dockerfile "${CI_PROJECT_DIR}/api/Dockerfile" \
        --destination "${IMAGE_API}:${TAG}" \
        --destination "${IMAGE_API}:latest" \
        --snapshot-mode=redo \
        --push-retry=3
  only:
    - merge_requests
    - main
  when: manual

build:web:
  stage: build
  timeout: 1h
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - |
      mkdir -p /kaniko/.docker
      AUTH="$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$HARBOR_REGISTRY" "$AUTH" \
        > /kaniko/.docker/config.json
  script:
    - |
      TAG="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
      echo "Building ${IMAGE_WEB}:${TAG}"
      /kaniko/executor \
        --context "dir://${CI_PROJECT_DIR}/web" \
        --dockerfile "${CI_PROJECT_DIR}/web/Dockerfile" \
        --destination "${IMAGE_WEB}:${TAG}" \
        --destination "${IMAGE_WEB}:latest" \
        --snapshot-mode=redo \
        --push-retry=3
  only:
    - merge_requests
    - main
  when: manual

test:db-migrations:
  stage: test
  image: python:3.14-slim
  script:
    - cd api
    - pip install --no-cache-dir -e ".[dev]"
    - python -c "import starlette; print(f'Starlette {starlette.__version__} installed')"
    - alembic upgrade head --sql
    - echo "Database schema migrations validated"
  only:
    - merge_requests
    - main
